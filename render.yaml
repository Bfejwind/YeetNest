# Single-instance pilot; configure PostgreSQL and Pinata. Disk also supports self-hosted media.
services:
  - type: web
    name: yeetnest
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /readyz
    numInstances: 1
    disk:
      name: yeetnest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MODERATOR_WALLETS
        sync: false
      - key: INDEXER_PROTOCOL
        value: pump
      - key: RPC_SHARED_INTERVAL_MS
        value: "500"
      - key: CLOUDFLARE_STREAM_CUSTOMER_CODE
        sync: false
  - type: worker
    name: yeetnest-launchlab-indexer
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run indexer
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: INDEXER_ROLE
        value: all
      - key: INDEXER_SCOPE
        value: targeted
      - key: INDEXER_BACKFILL
        value: "false"
      - key: RPC_SHARED_INTERVAL_MS
        value: "500"
      - key: INDEXER_RPC_INTERVAL_MS
        value: "1000"
      - key: INDEXER_PROTOCOL
        value: pump
      - key: INDEXER_CONCURRENCY
        value: "1"
      - key: INDEXER_PAGE_SIZE
        value: "25"
      - key: INDEXER_SCAN_INTERVAL_MS
        value: "15000"
      - key: INDEXER_MAX_PENDING
        value: "10000"
